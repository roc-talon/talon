# The settings of `roc-cfw deploy` for the registry Worker (docs/registry/deploy.md).
# same-body: the body must be equal to the body before the deploy. Only routes whose body does not change by itself.
# ignore = ["/checked"]: the releases and artifact routes of a package end with the `checked` item (R-AP29: name, checked_at, stale). checked_at changes when ReconcileCron
# writes repo_checks, and stale is computed from the request time, so that member can change with no write. The other members are compared (checked on prod 2026-11-11: only `checked` differs).
# Not here: /v1/toolchains, /v1/packages?q=, /v1/releases?after=, /v1/sweeps/*, .../compat (a cron, the bot or an ingest changes the whole body). They are status only.
[deploy]
url = "https://registry.roc-talon.org"
# One HTTP request of a check. The slowest route (/v1/releases?after=100, 90 KB) took 0.36 s cold on 2026-11-11; 10 s is a wide margin.
timeout = 10
migrate = ["DB"]

[[deploy.smoke]]
path = "/v1/packages/imclerran/roc-isodate/releases"
same-body = true
ignore = ["/checked"]

[[deploy.smoke]]
path = "/v1/packages/Imclerran/Roc-Isodate/releases"
same-body = true
ignore = ["/checked"]

[[deploy.smoke]]
path = "/v1/packages/hasnep/roc-ascii/releases"
same-body = true
ignore = ["/checked"]

[[deploy.smoke]]
path = "/v1/artifacts/H363y6zEDk8hbLgYVpyALt7cYS6w65sHMfoPEaCNqQY9"
same-body = true
ignore = ["/checked"]

[[deploy.smoke]]
path = "/v1/packages?short=isodate"
same-body = true

# Status only: the whole body can change by itself (a cron, the bot, an ingest).
[[deploy.smoke]]
path = "/v1/toolchains"

[[deploy.smoke]]
path = "/v1/artifacts/H363y6zEDk8hbLgYVpyALt7cYS6w65sHMfoPEaCNqQY9/compat"

[[deploy.smoke]]
path = "/v1/packages?q=roc"

[[deploy.smoke]]
path = "/v1/releases?after=100"

[[deploy.smoke]]
path = "/v1/sweeps/nightly-2026-11-06-34f137a"

# Error answers: a wrong method, a missing item, a bad query.
[[deploy.smoke]]
path = "/v1/toolchains/nightly-2026-10-30-0602c5f"
status = 405

[[deploy.smoke]]
path = "/v1/closure"
status = 405

[[deploy.smoke]]
path = "/v1/packages/nobody/none/releases"
status = 404

[[deploy.smoke]]
path = "/v1/artifacts/11111111111111111111111111111111"
status = 404

[[deploy.smoke]]
path = "/v1/releases"
status = 400

[[deploy.smoke]]
path = "/v1/compat_hints"
status = 400
