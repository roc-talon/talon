name = "talon-registry"
main = "worker.js"
compatibility_date = "2026-10-01"
# enable_request_signal and global_fetch_strictly_public: cloudflare-workers/README.md "Use it in your project", step 4.
compatibility_flags = ["enable_request_signal", "global_fetch_strictly_public"]

# D1 (slice 101: the binding that main.roc declares). The id is a placeholder: a local run makes an empty database.
# For a deploy: `wrangler d1 create talon-registry`, and put its id here. The migrations are in ../sql (slice 102).
[[d1_databases]]
binding = "DB"
database_name = "talon-registry"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../sql"

# Later slices add their entries here (the names are in Registry 8, R-WH14), and main.roc declares each one in `Worker.new({ bindings })`, so `roc-cfw sync` checks it:
# - R2 `LOG` (the log tiles, P3, slice 130)
# - queues `INDEX` and `INDEX_DLQ` (slice 118), and the consumer
# - rate limit bindings `RL_INGEST`, `RL_HINTS`, `RL_LOGIN` (slices 112, 116, 117)
# - [triggers] crons (slices 119, 120)
# - [vars] AUDIENCE, BOT_REPOSITORY_ID, BOT_WORKFLOW_REF, ISSUES_URL, MIN_TLN, MIN_TLN_WRITE (the secrets are set with `wrangler secret put`)
